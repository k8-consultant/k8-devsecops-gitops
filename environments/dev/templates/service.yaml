apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    monitoring: {{ .Release.Name }}-active
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
