apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-smoke-test
spec:
  metrics:
    - name: predict-smoke-test
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke-test
                    image: curlimages/curl:8.12.1
                    command: ["/bin/sh", "-ec"]
                    args:
                      - 'curl --fail --silent --show-error --max-time 10 http://{{ .Release.Name }}-canary:{{ .Values.service.port }}/predict'
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
